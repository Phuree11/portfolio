<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Game designer portfolio — narrative, characters, dialogue and systems.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Phuree Sirikunchukit — Game Designer">
  <meta property="og:description" content="Game designer portfolio — narrative, characters, dialogue and systems.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23959595' stroke-width='1.5'/%3E%3Ccircle cx='24' cy='8.5' r='4' fill='%236ba8dd'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/righteous-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- space background: each page has its own set of orbits; app.js draws them and fades between pages -->
  <div class="space" id="space" aria-hidden="true"></div>

  <header class="top">
    <nav class="nav" aria-label="Main">
      <a class="nb" href="#about" data-v="about" data-i18n="nav.about"></a>
      <a class="nb" href="#work" data-v="work" data-i18n="nav.work"></a>
      <a class="nb" href="#contact" data-v="contact" data-i18n="nav.contact"></a>
      <a class="nb" id="nav-cv" href="#" target="_blank" rel="noopener" hidden></a>
      <a class="nb" id="nav-back" href="#work" data-i18n="nav.back" hidden></a>
    </nav>
    <button type="button" class="langsw" id="langsw" role="switch" aria-checked="false" aria-label="Language: EN / TH">
      <span class="lt" data-l="en">EN</span>
      <span class="track" aria-hidden="true"><i></i></span>
      <span class="lt" data-l="th">TH</span>
    </button>
  </header>

  <main id="top">
    <!-- ============ OPENING ============ -->
    <section class="view" id="v-home">
      <h1 class="hello">
        <span class="hello-name" id="home-name"></span>
        <span class="hello-role" id="home-role"></span>
      </h1>
    </section>

    <!-- ============ ABOUT ============ -->
    <section class="view" id="v-about" hidden>
      <h2 class="a-name" id="about-name"></h2>
      <p class="a-role" id="about-role"></p>
      <div class="a-bio" id="about-bio"></div>
      <div class="a-cols" id="about-skills"></div>
    </section>

    <!-- ============ WORK ============ -->
    <section class="view" id="v-work" hidden>
      <h2 class="sr" data-i18n="work.title"></h2>
      <div class="grid" id="project-grid"></div>
    </section>

    <!-- ============ CONTACT ============ -->
    <section class="view" id="v-contact" hidden>
      <h2 class="sr" data-i18n="contact.title"></h2>
      <div id="contact-groups"></div>
    </section>

    <!-- ============ PROJECT PAGE (not redesigned yet) ============ -->
    <section class="view" id="v-detail" hidden></section>
  </main>

  <script src="content.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
