<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phuree — Game Designer</title>
  <meta name="description" content="Game designer portfolio — narrative, characters, dialogue and systems.">
  <meta name="theme-color" content="#050505">
  <meta property="og:title" content="Phuree — Game Designer">
  <meta property="og:description" content="Game designer portfolio — narrative, characters, dialogue and systems.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M8 4v24M4 16h24' stroke='%23f2ff2e' stroke-width='2'/%3E%3Cpath d='M20 4l8 8' stroke='%23ff2b4a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- neon crossing lines (decorative) -->
  <div class="bg" aria-hidden="true">
    <i class="ln v-y"></i>
    <i class="ln h-g"></i>
    <i class="ln d-r"></i>
    <i class="ln v-g"></i>
    <i class="ln h-r"></i>
  </div>

  <header class="top">
    <a class="brand" href="#top" id="brand"></a>
    <nav aria-label="Main">
      <a href="#projects" data-i18n="nav.projects"></a>
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="th">TH</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-name"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="cta">
        <a class="btn y" href="#projects" data-i18n="hero.viewWork"></a>
        <a class="btn g" href="#contact" data-i18n="hero.contactMe"></a>
      </div>
    </section>

    <section id="projects" class="sec">
      <h2><span class="idx">01</span><span data-i18n="projects.title"></span></h2>
      <div class="grid" id="project-grid"></div>
    </section>

    <section id="about" class="sec">
      <h2><span class="idx">02</span><span data-i18n="about.title"></span></h2>
      <div class="about">
        <div class="bio" id="about-bio"></div>
        <div class="skills" id="about-skills"></div>
      </div>
    </section>

    <section id="contact" class="sec">
      <h2><span class="idx">03</span><span data-i18n="contact.title"></span></h2>
      <p class="lead" id="contact-lead"></p>
      <ul class="contact-list" id="contact-list"></ul>
    </section>
  </main>

  <footer class="foot">
    <span id="foot-text"></span>
    <a href="#top" data-i18n="footer.top"></a>
  </footer>

  <dialog id="modal" aria-labelledby="m-title">
    <div class="m-inner" id="m-inner"></div>
  </dialog>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
